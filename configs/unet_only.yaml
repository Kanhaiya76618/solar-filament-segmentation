# U-Net-only variant: no detector, each connected filament region becomes one instance.
# For training on a laptop: on an Apple M5, U-Net training is ~4 s/step, but YOLO training would
# take ~100 h. Expect a lower PQ than the full pipeline (more split and merged filaments).
#   python -m src.cli train-unet --config configs/unet_only.yaml --fold 0
#   python -m src.cli validate   --config configs/unet_only.yaml --fold 0
#   python -m src.cli predict    --config configs/unet_only.yaml --folds 0 --out outputs/unet_only/submission.csv
inherit: default.yaml

weights_dir: outputs/unet_only/weights   # kept apart from weights/, which holds the full pipeline
output_dir: outputs/unet_only

unet:
  epochs: 12

yolo:
  models: []

postproc:
  unclaimed_min_area: 300
  unclaimed_min_prob: 0.5

tune:
  unet_threshold: [0.3, 0.4, 0.5, 0.6]
  close_radius: [2, 3, 5, 8]
  claim_dilation: [4]
  det_threshold: [0.3]
  min_area: [200]
  unclaimed_min_area: [100, 200, 400, 800]
  unclaimed_min_prob: [0.4, 0.5, 0.6, 0.7]
  boundary_offset: [-1, 0, 1]
